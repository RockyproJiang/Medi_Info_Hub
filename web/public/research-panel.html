      : '<text x="'+lx.toFixed(1)+'" y="'+ly+'" font-size="11.5" fill="#5A6B7C" text-anchor="middle">'+esc(trunc(x,12))+'</text>';
  });
  return '<svg viewBox="0 0 '+W+' '+H+'">'+g+legendSVG(spec.series,L,16)+b+'</svg>';
}
/* ---------- 条形图（横向，单系列） ---------- */
function chHBar(spec, rows){
  const n=rows.length, rowH=Math.min(28, 250/Math.max(1,n));
  const W=620, H=Math.max(130, n*rowH+66), L=132, R=58, T=28, B=12, iw=W-L-R, ih=H-T-B;
  const vals = rows.map(r=>{const s0=spec.series[0];const v=r[s0.field];return v==null?0:+v*(s0.scale||1);});
  const mx = nice(Math.max(0.0001, ...vals));
  let g='<line x1="'+L+'" y1="'+T+'" x2="'+L+'" y2="'+(T+ih)+'" stroke="#C9D2DC"/>';
  rows.forEach((r,i)=>{
    const bh=rowH*0.62, yy=T+i*rowH+(rowH-bh)/2, w=vals[i]/mx*iw;
    g += '<text x="'+(L-6)+'" y="'+(yy+bh/2+3.5).toFixed(1)+'" font-size="11" fill="#5A6B7C" text-anchor="end">'+esc(trunc(r[spec.xField],12))+'</text>'
       + '<rect x="'+L+'" y="'+yy.toFixed(1)+'" width="'+Math.max(1,w).toFixed(1)+'" height="'+bh.toFixed(1)+'" rx="3" fill="'+PAL[0]+'"><title>'+esc(r[spec.xField])+'：'+fmt(vals[i],mx)+'</title></rect>'
       + '<text x="'+(L+w+6).toFixed(1)+'" y="'+(yy+bh/2+3.5).toFixed(1)+'" font-size="10.5" fill="#5A6B7C">'+fmt(vals[i],mx)+'</text>';
  });
  return '<svg viewBox="0 0 '+W+' '+H+'">'+g+legendSVG(spec.series,L,16)+'</svg>';
}
/* ---------- 折线图（多系列） ---------- */
function chLine(spec, rows){
  const W=620,H=310,L=56,R=16,T=30,B=40, iw=W-L-R, ih=H-T-B;
  const xs = rows.map(r=>r[spec.xField]);
  const sers = spec.series.map(s=>rows.map(r=>{const v=r[s.field];return v==null?0:+v*(s.scale||1);}));
  const mx = nice(Math.max(0.0001, ...[].concat(...sers)));
  const X = i => L + (xs.length===1 ? iw/2 : iw*i/(xs.length-1));
  const Y = v => T+ih - (v/mx)*ih;
  let g='';
  for(let t=0;t<=4;t++){ const v=mx*t/4;
    g += '<line x1="'+L+'" y1="'+Y(v)+'" x2="'+(W-R)+'" y2="'+Y(v)+'" stroke="#E4E9EF"/>'
       + '<text x="'+(L-8)+'" y="'+(Y(v)+4)+'" font-size="10.5" fill="#8A97A5" text-anchor="end">'+fmt(v,mx)+'</text>';
  }
  xs.forEach((x,i)=>{ g += '<text x="'+X(i).toFixed(1)+'" y="'+(T+ih+18)+'" font-size="11.5" fill="#5A6B7C" text-anchor="middle">'+esc(x)+'</text>'; });
  sers.forEach((vals,si)=>{
    const pts = vals.map((v,i)=>X(i).toFixed(1)+','+Y(v).toFixed(1)).join(' ');
    g += '<polyline points="'+pts+'" fill="none" stroke="'+PAL[si%PAL.length]+'" stroke-width="2.5"/>';
    vals.forEach((v,i)=>{
      g += '<circle cx="'+X(i).toFixed(1)+'" cy="'+Y(v).toFixed(1)+'" r="4" fill="'+PAL[si%PAL.length]+'"><title>'+esc(xs[i])+' · '+esc(spec.series[si].name)+'：'+fmt(v,mx)+'</title></circle>';
    });
  });
  return '<svg viewBox="0 0 '+W+' '+H+'">'+g+legendSVG(spec.series,L,16)+'</svg>';
}
/* ---------- 散点图 ---------- */
function chScatter(spec, rows){
  const W=620,H=330,L=60,R=22,T=30,B=52, iw=W-L-R, ih=H-T-B;
  const xs=rows.map(r=>+r[spec.xField]||0), ys=rows.map(r=>+r[spec.yField]||0);
  const ns=rows.map(r=>spec.sizeField?(+r[spec.sizeField]||1):5);
  const mx=nice(Math.max(0.0001,...xs)), my=nice(Math.max(0.0001,...ys));
  const X=v=>L+(v/mx)*iw, Y=v=>T+(1-v/my)*ih;
  let g='';
  for(let t=0;t<=4;t++){
    const vx=mx*t/4, vy=my*t/4;
    g += '<line x1="'+X(vx)+'" y1="'+T+'" x2="'+X(vx)+'" y2="'+(T+ih)+'" stroke="#EFF2F6"/>'
       + '<line x1="'+L+'" y1="'+Y(vy)+'" x2="'+(W-R)+'" y2="'+Y(vy)+'" stroke="#EFF2F6"/>'
       + '<text x="'+X(vx)+'" y="'+(T+ih+16)+'" font-size="10.5" fill="#8A97A5" text-anchor="middle">'+fmt(vx,mx)+'</text>'
       + '<text x="'+(L-8)+'" y="'+(Y(vy)+4)+'" font-size="10.5" fill="#8A97A5" text-anchor="end">'+fmt(vy,my)+'</text>';
  }
  g += '<line x1="'+L+'" y1="'+(T+ih)+'" x2="'+(W-R)+'" y2="'+(T+ih)+'" stroke="#C9D2DC"/>'
     + '<line x1="'+L+'" y1="'+T+'" x2="'+L+'" y2="'+(T+ih)+'" stroke="#C9D2DC"/>'
     + '<text x="'+(L+iw/2)+'" y="'+(H-10)+'" font-size="12" fill="#0F2942" text-anchor="middle">'+esc(spec.xTitle||spec.xField)+'</text>'
     + '<text x="16" y="'+(T+ih/2)+'" font-size="12" fill="#0F2942" text-anchor="middle" transform="rotate(-90 16 '+(T+ih/2)+')">'+esc(spec.yTitle||spec.yField)+'</text>';
  rows.forEach((r,i)=>{
    const rr=Math.min(13, 2.5+Math.sqrt(ns[i])*1.1);
    g += '<circle cx="'+X(xs[i]).toFixed(1)+'" cy="'+Y(ys[i]).toFixed(1)+'" r="'+rr.toFixed(1)+'" fill="#FF5A1F" fill-opacity="0.55" stroke="#FF5A1F"><title>'+esc(spec.tipField?r[spec.tipField]:'样本 '+ns[i])+'：'+esc(spec.xTitle||'')+' '+fmt(xs[i],mx)+' / '+esc(spec.yTitle||'')+' '+fmt(ys[i],my)+'</title></circle>';
  });
  return '<svg viewBox="0 0 '+W+' '+H+'">'+g+'</svg>';
}
function chartSVG(spec){
  let rows = spec.data ? spec.data : spec._rows;
  if (!spec.data && rows.length && Array.isArray(rows[0]) && spec._cols) {
    rows = rows.map(r => { const o = {}; spec._cols.forEach((c, i) => o[c] = r[i]); return o; });
  }
  rows = prep(spec, rows);
  if(spec.type==='hbar')    return chHBar(spec, rows);
  if(spec.type==='line')    return chLine(spec, rows);
  if(spec.type==='scatter') return chScatter(spec, rows);
  return chBar(spec, rows);
}

const tabsEl = document.getElementById('tabs');
PANELS.forEach((p, i) => {
  const t = document.createElement('div');
  t.className = 'tab' + (p.is_view ? ' view' : '');
  t.innerHTML = p.title + '<span class="cnt">(' + p.rows.length + ')</span>';
  t.onclick = () => { cur = i; kw = ''; document.getElementById('q').value = ''; render(); };
  tabsEl.appendChild(t);
});
function cell(v) {
  if (v === null || v === undefined) return '<span style="color:#C4CCD4">—</span>';
  let s = String(v);
  if (/^-?\d+(\.\d+)?$/.test(s)) return '<td class="num">' + s + '</td>';
  if (s === '城市') return '<td><span class="badge b-city">城市</span></td>';
  if (s === '县城') return '<td><span class="badge b-county">县城</span></td>';
  if (s === '农村') return '<td><span class="badge b-rural">农村</span></td>';
  return '<td>' + s.replace(/&/g,'&amp;').replace(/</g,'&lt;') + '</td>';
}
function render() {
  const p = PANELS[cur];
  document.querySelectorAll('.tab').forEach((t, i) => t.classList.toggle('active', i === cur));
  document.getElementById('ptitle').textContent = p.title;
  document.getElementById('pdesc').textContent = p.desc + '　共 ' + p.rows.length + ' 行';
  /* 图表 */
  const cEl = document.getElementById('charts');
  const specs = (CHARTS[p.name] || []).map(s => Object.assign({}, s, {_rows: p.rows, _cols: p.cols}));
  if (specs.length) {
    cEl.style.display = 'flex';
    cEl.innerHTML = specs.map(s => '<div class="chartbox"><h3>📊 ' + esc(s.title) + '</h3>' + chartSVG(s) + '</div>').join('');
  } else { cEl.style.display = 'none'; cEl.innerHTML = ''; }
  /* 明细表 */
  const rows = kw ? p.rows.filter(r => r.some(c => String(c ?? '').toLowerCase().includes(kw))) : p.rows;
  let h = '<thead><tr>' + p.cols.map(c => '<th>' + c + '</th>').join('') + '</tr></thead><tbody>';
  rows.slice(0, 500).forEach(r => { h += '<tr>' + r.map(cell).join('') + '</tr>'; });
  h += '</tbody>';
  document.getElementById('tbl').innerHTML = h;
  if (kw && rows.length > 500) document.getElementById('tbl').insertAdjacentHTML('beforeend',
    '<tr><td colspan="99" style="color:#9AA6B2">仅显示前 500 条，共 ' + rows.length + ' 条匹配</td></tr>');
}
document.getElementById('q').addEventListener('input', e => { kw = e.target.value.trim().toLowerCase(); render(); });
render();
</script>
